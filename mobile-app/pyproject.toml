[project]
name = "epiprot"
version = "0.1.0"
description = "EEG-based epileptic seizure pre-ictal research prototype (CHB-MIT)"
requires-python = ">=3.10"
dependencies = [
    "mne>=1.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "edfio>=0.4",
    "torch>=2.2",
    "edfio>=0.4",
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
epiprot = "epiprot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"